<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>探针</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2316a34a' stroke-opacity='.3' stroke-width='2.5'/><circle cx='16' cy='16' r='6' fill='%2316a34a'/></svg>">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f9; --bg-a:rgba(244,246,249,.82); --panel:#fff; --panel-2:#fafbfc;
  --line:#e4e7ec; --line-2:#eff1f4;
  --fg:#18181b; --muted:#6b7280; --faint:#a3a9b5;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --accent:#2563eb;
  /* 图表色板。顺序即优先级：前三个必须彼此高度可辨——卡片上三网并排，
     蓝 / 橙 / 紫在深浅两种主题下都能一眼分开，绿和红留给在线与告警语义。 */
  --c1:#2563eb; --c2:#ea580c; --c3:#9333ea; --c4:#0891b2; --c5:#16a34a;
  --r:14px; --r-sm:10px;
  /* 两级阴影：静置时只给一层极浅的边界感，悬停时才抬起。 */
  --sh-1:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  --sh-2:0 12px 28px -10px rgba(15,23,42,.20), 0 3px 8px -3px rgba(15,23,42,.08);
  /* 页头背景的柔光，让整页不是一块死板的纯色。 */
  --glow-1:rgba(37,99,235,.07); --glow-2:rgba(147,51,234,.055);
  --map-land:#ccd3de;
  --tnum:tabular-nums;
}
html.dark{
  --bg:#0a0b0e; --bg-a:rgba(10,11,14,.82); --panel:#131417; --panel-2:#181a1e;
  --line:#26282e; --line-2:#1f2126;
  --fg:#f2f3f5; --muted:#a1a7b3; --faint:#666c78;
  --ok:#22c55e; --warn:#f59e0b; --bad:#f87171; --accent:#60a5fa;
  --c1:#60a5fa; --c2:#fb923c; --c3:#c084fc; --c4:#22d3ee; --c5:#4ade80;
  /* 深色下纯黑阴影落在近黑背景（--bg #0a0b0e）上几乎看不见，悬停就少了「抬起」的感觉。
     补一圈极淡的浅色外描边 + 一点柔光：抬升在深色里也读得出来，而不只是边框变亮。 */
  --sh-1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.35);
  --sh-2:0 16px 34px -14px rgba(0,0,0,.92), 0 4px 12px -5px rgba(0,0,0,.62),
         0 0 0 1px rgba(255,255,255,.04), 0 0 24px -10px rgba(255,255,255,.07);
  --glow-1:rgba(96,165,250,.10); --glow-2:rgba(192,132,252,.075);
  --map-land:#2a3038;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  background-image:
    radial-gradient(880px 420px at 10% -150px, var(--glow-1), transparent 70%),
    radial-gradient(760px 380px at 90% -130px, var(--glow-2), transparent 70%);
  background-repeat:no-repeat;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.tnum{font-variant-numeric:var(--tnum)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.wrap{padding:0 24px}}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--bg-a);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;height:52px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:-.1px;margin-right:auto;transition:opacity .15s}
.hd-actions{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.brand:hover{opacity:.7}
.brand .mark{width:13px;height:13px;border-radius:50%;background:linear-gradient(140deg,var(--ok),color-mix(in srgb,var(--ok) 55%,var(--c4)));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:31px;padding:0 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--muted);background:var(--panel);box-shadow:var(--sh-1);transition:color .15s,border-color .15s,box-shadow .15s,transform .15s}
.iconbtn:hover{color:var(--fg);border-color:var(--faint);box-shadow:var(--sh-2);transform:translateY(-1px)}
.iconbtn.only{width:31px;padding:0}
.iconbtn svg{width:15px;height:15px}

main{padding:18px 0 64px}
.alert{margin:0 0 14px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--bad) 8%,var(--panel));color:var(--bad);font-size:13px;display:flex;gap:10px;align-items:center}
.alert button,.alert a{text-decoration:underline;color:inherit}

/* ---------- summary ---------- */
/* ---------- 顶部：磁贴靠左 + 右侧世界地图 ---------- */
/* 类名不能叫 .top——头部 <header class="top"> 已占用，撞车会互相污染 */
.overview{display:grid;grid-template-columns:1fr;gap:13px;margin-bottom:16px}
/* 宽屏下磁贴是**田字格**（2×2），与右侧地图左右并排。
   断点取 980 而不是 1040：平板横屏（iPad 1024）要能并排，否则会掉进单列、上下堆叠。
   两列宽度按「两者高度接近」来定：地图高 = 宽/2.54（183×72 的等比方格），
   磁贴块高 = 2 行 + 间距。比例失衡时高的一侧会把另一侧撑出一大块空白。 */
@media(min-width:980px){
  .overview{grid-template-columns:minmax(0,.48fr) minmax(0,.52fr);align-items:stretch}
}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:0}
/* 汇总磁贴：顶部一道彩色细条 + 同色的小圆点，四个磁贴各有自己的色相，
   整页的底色仍然克制。 */
.tile{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 13px 9px;min-width:0;box-shadow:var(--sh-1);line-height:1.35}
.tile::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--tint,var(--faint))}
.tile.t-online{--tint:var(--ok)}
.tile.t-lat{--tint:var(--c1)}
.tile.t-flow{--tint:var(--c4)}
.tile.t-cost{--tint:var(--c3)}
.tile .k{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .k .dot{background:var(--tint,var(--faint))}
.tile .v{font-size:17px;font-weight:650;margin-top:3px;letter-spacing:-.4px;font-variant-numeric:var(--tnum);overflow-wrap:anywhere}
.tile .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.tile .s{font-size:10.5px;color:var(--faint);margin-top:1px;font-variant-numeric:var(--tnum);overflow-wrap:anywhere}
/* 窄屏上顶部要占更少：磁贴再收一档，地图也不留最小高度 */
@media(max-width:560px){
  .tile{padding:8px 11px 7px}
  .tile .v{font-size:16px;margin-top:2px}
  .tile .k{font-size:11px}
  .tile .s{font-size:10.5px}
  .mapwrap{min-height:0}
  .overview{gap:10px}
}
/* 田字格里每格面积大了，字号也要跟上，否则四块大卡片里塞着四行小字显得空 */
@media(min-width:980px){
  .tile{padding:20px 16px 18px}
  .tile .k{font-size:12px}
  .tile .v{font-size:28px;margin-top:6px;letter-spacing:-.7px}
  .tile .s{font-size:11.5px;margin-top:3px}
}
/* 磁贴内文字居中 */
.tile{text-align:center}
.tile .k{justify-content:center}

/* ---------- 世界地图 ---------- */
.mapbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-1);padding:12px 14px 10px;min-width:0;display:flex;flex-direction:column}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.maphead .hint{font-size:11px;color:var(--faint)}
.mapwrap{flex:1;display:flex;align-items:center;min-height:120px}
.worldmap{display:block;width:100%;height:auto;overflow:visible}
/* 陆地点：零长度线段 + 圆头线帽 = 圆点，比方块精致。
   点径要跟着格子走：格距 6 单位，点径取 4.8 约合八成填充——
   再小会在地图被缩窄后糊成灰雾，再大就几乎连成一片。 */
.worldmap .land{fill:none;stroke:var(--map-land);stroke-width:4.8;stroke-linecap:round}
/* 亮点是纯色圆点，颜色即在线情况 */
.mdot{cursor:pointer;stroke:var(--panel);stroke-width:2.5;transition:stroke-width .15s}
.mdot.t-ok{fill:var(--ok)}
.mdot.t-warn{fill:var(--warn)}
.mdot.t-bad{fill:var(--bad)}
.mdot:hover,.mdot:focus-visible{stroke-width:4;outline:none}
.mdot:focus-visible{stroke:var(--fg)}
.mpop .ph b{display:inline-flex;align-items:center;gap:5px}
.mapfoot{margin-top:7px;padding-top:7px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--faint);
  display:flex;gap:5px 12px;flex-wrap:wrap;align-items:center}
.mapfoot .lg{display:inline-flex;align-items:center;gap:5px}
.mapfoot .lg i{width:8px;height:8px;border-radius:50%;display:block}
.mapfoot .lg.o i{background:var(--ok)}
.mapfoot .lg.w i{background:var(--warn)}
.mapfoot .lg.b i{background:var(--bad)}
.mapfoot .sp{flex:1}

/* 地区亮点被点击后弹出的节点选择 */
.mpop{position:absolute;z-index:30;min-width:190px;max-width:270px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-2);padding:7px}
.mpop .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 5px 7px;
  font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line-2);margin-bottom:5px}
.mpop .ph b{color:var(--fg);font-weight:600}
.mpop .pn{display:block;width:100%;text-align:left;padding:6px 7px;border-radius:7px;transition:background .15s}
.mpop .pn:hover,.mpop .pn:focus-visible{background:var(--panel-2);outline:none}
.mpop .pn .r1{display:flex;align-items:center;gap:7px;min-width:0}
.mpop .pn .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpop .pn .r2{margin-top:2px;padding-left:13px;font-size:11px;color:var(--faint);font-variant-numeric:var(--tnum)}

/* ---------- 工具栏：搜索与分组 ---------- */
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.search{position:relative;display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:360px;height:34px;
  padding:0 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search svg{width:15px;height:15px;color:var(--faint);flex-shrink:0}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13px;color:var(--fg);outline:none}
.search input::placeholder{color:var(--faint)}
.search .clr{flex-shrink:0;color:var(--faint);font-size:16px;line-height:1;padding:0 1px}
.search .clr:hover{color:var(--fg)}
/* 工具栏里的分组控件与搜索框共用一套：等高、同圆角、同边框与阴影。
   只作用于 .tools 内部——详情页面板里的 .seg 仍需保持紧凑。
   margin-left:auto 让分组控件靠右，与左侧搜索框拉开，而不是紧贴其后留一大段空白。 */
.tools .seg{margin-left:auto;flex:0 1 auto;height:34px;padding:3px;border-radius:10px;
  background:var(--panel);box-shadow:var(--sh-1);flex-wrap:wrap}
.tools .seg button{font-size:12.5px;padding:0 12px;height:100%;border-radius:7px}
/* 窄屏：两者各占一行且**等宽**。搜索框必须去掉 max-width，
   否则它会停在 360px 而分组控件占满整行，看起来就是「大小不一致」。
   注意 flex-basis 必须带单位——写 flex:1 1 100 是无效声明（只有 0 可省单位），
   整条会被丢弃，窄屏规则就永远不生效。 */
@media(max-width:560px){
  .tools .search{max-width:none;flex:1 1 100%}
  .tools .seg{flex:1 1 100%;margin-left:0}
  .tools .seg button{flex:1 1 0;padding:0 6px}
}

/* ---------- 分组标题 ---------- */
.ghead{display:flex;align-items:center;gap:9px;margin:20px 0 11px;font-size:12.5px;color:var(--muted)}
.ghead:first-child{margin-top:0}
.ghead b{color:var(--fg);font-weight:600}
.ghead .n{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-variant-numeric:var(--tnum)}
.ghead::after{content:"";flex:1;height:1px;background:var(--line-2)}
.ghint{font-size:12px;color:var(--faint);margin:0 0 10px}

/* ---------- node grid ---------- */
/* 卡片内容密度高（三路延迟 + 三条占用 + 速率费用流量），最窄也要保证
   占用条的数值不被截断，所以最多排三列，断点相应上移。 */
.grid{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:780px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1140px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;cursor:pointer;
  box-shadow:var(--sh-1);transition:border-color .18s,transform .18s,box-shadow .18s}
.card:hover{border-color:var(--faint);transform:translateY(-2px);box-shadow:var(--sh-2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.off{background:var(--panel-2);box-shadow:none}
.card.off .nname{color:var(--muted)}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead .l{min-width:0;flex:1}
.nline{display:flex;align-items:center;gap:6px;min-width:0}
.nname{font-weight:640;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .r{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.sub{margin-top:4px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:var(--tnum)}
/* 在线时给状态徽标上一层淡绿底，卡片头部因此有了色彩落点 */
.chip.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,var(--line));background:color-mix(in srgb,var(--ok) 9%,transparent)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 34%,var(--line));background:color-mix(in srgb,var(--warn) 9%,transparent)}
.fg{font-style:normal;font-size:13px;line-height:1;flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.dot.off{background:var(--faint)}
.dot.pending{background:var(--warn)}
.dot.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.exp{font-size:11.5px;font-variant-numeric:var(--tnum);white-space:nowrap}
/* 所有到期状态共用同一套胶囊几何：与状态徽标同为 20px 高，卡片右侧两行才能对齐。
   只用颜色区分紧急程度，形状不随状态变化——否则同一列里一高一矮、一有一无，看着就是错位。 */
.exp.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;
  font-weight:600;font-size:11.5px;border:1px solid}
.exp.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,transparent);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.exp.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.exp.pill.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 26%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent);font-weight:550}
.exp.pill.calm{color:var(--muted);border-color:var(--line);background:var(--panel-2);font-weight:500}

/* ---------- 延迟检测块：每路探测一行，三网就有三行 ---------- */
.latbox{margin-top:12px;padding:10px 11px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 5%,var(--panel)) 0%,var(--panel-2) 100%)}
.lathead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;color:var(--muted);margin-bottom:5px}
.lathead .hint{font-size:10.5px;color:var(--faint)}
/* 行区高度固定为 CARD_PROBES 行（3 × 23px）：数据还没到时不会塌下去，
   到达之后也不会有一次高度跳动。只有一行的状态（加载中、离线、无探测）在行区内垂直居中。 */
.latrows{display:flex;flex-direction:column;justify-content:center;min-height:69px}
/* 加载骨架：与真实行等高，轻微呼吸——说明「正在取数据」而不是「没有数据」 */
.latrow.sk .pd{background:var(--line)}
.latrow.sk .sp .skbar{flex:1;height:6px;border-radius:3px;background:var(--line-2);animation:skpulse 1.8s ease-in-out infinite}
@keyframes skpulse{0%,100%{opacity:.5}50%{opacity:1}}
.latrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(32px,1.05fr) auto;align-items:center;gap:9px;height:23px;font-size:11.5px}
.latrow .pn{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted)}
/* 色点与曲线同色，一路一色；名称保持中性，三行彩色文字反而不好认 */
.latrow .pn .pd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.latrow .pn .txt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.latrow .sp{display:flex;min-width:0}
.latrow .sp svg{display:block;width:100%;height:18px}
/* 时延与丢包各占固定宽度并右对齐：丢包率一律显示（含 0%），
   否则只有丢包的那一行多出一段，时延数值就参差不齐了。 */
.latrow .pv{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:6px;font-variant-numeric:var(--tnum)}
.latrow .pv .ms{min-width:48px;text-align:right;font-weight:550;white-space:nowrap}
.latrow .pv .ms .u{font-weight:400;font-size:10.5px;color:var(--muted)}
.latrow .pv .loss{min-width:34px;text-align:right;font-style:normal;font-size:10.5px;color:var(--faint)}
.latrow .pv .loss.hit{color:var(--bad);font-weight:550}
.latrow.solo .pn{color:var(--faint)}
.latmore{font-size:10.5px;color:var(--faint);padding-top:2px}

/* ---------- 三条占用：CPU / 内存 / 硬盘，各有一色 ---------- */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.meter{min-width:0}
.meter .ml{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .mv{font-size:11.5px;font-variant-numeric:var(--tnum);color:var(--fg);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--fill,var(--fg));transition:width .4s ease}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.bar i.flat{background:var(--faint)}

/* ---------- 脚注：速率与费用一行，流量统计压成一行 ---------- */
.cfoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2);font-variant-numeric:var(--tnum)}
.cfoot .crow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:11.5px}
.cfoot .rates{display:inline-flex;gap:14px;min-width:0}
.cfoot .io{color:var(--muted);white-space:nowrap}
.cfoot .io .d{color:var(--c1)}
.cfoot .io .u{color:var(--c2)}
.cfoot .io b{color:var(--fg);font-weight:550}
/* 价格栏：margin-left:auto 保证即使这一行换行、它独占一行时也仍然贴右。
   注意类名不能叫 .cost——详情页费用明细的 .cost 是四列网格，全局生效会把它也套进去。 */
.cfoot .price{margin-left:auto;text-align:right;color:var(--muted);white-space:nowrap}
.cfoot .price b{color:var(--fg);font-weight:550}
.cfoot .price b.free{color:var(--ok)}
.cfoot .trafficbar{height:2px;border-radius:1px;background:var(--line);margin:7px 0 6px;overflow:hidden}
.cfoot .trafficbar i{display:block;height:100%;border-radius:1px;background:var(--c4);transition:width .4s ease}
.cfoot .trafficbar i.warn{background:var(--warn)}
.cfoot .trafficbar i.bad{background:var(--bad)}
/* 同理不能叫 .sub：卡片头部的系统行 .sub 带 overflow:hidden 与 nowrap，会把这行裁掉 */
.cfoot .crow.small{font-size:11px;color:var(--faint)}
.cfoot .crow.small b{color:var(--muted);font-weight:550}

.empty{padding:64px 0;text-align:center;font-size:13px;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px}
.back:hover{color:var(--fg)}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.dhead h1{font-size:23px;font-weight:660;letter-spacing:-.5px}
.dsub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px;box-shadow:var(--sh-1)}
.panel>h2{font-size:13px;font-weight:620;display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
/* 每个面板左侧一道小色条，把详情页的几个区块分开 */
.panel>h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent-bar,var(--line));flex-shrink:0}
.panel.p-cost{--accent-bar:var(--c3)}
.panel.p-lat{--accent-bar:var(--c1)}
.panel.p-res{--accent-bar:var(--c4)}
.panel.p-info{--accent-bar:var(--faint)}
.panel>h2 .hint{font-size:11.5px;font-weight:400;color:var(--faint)}
.seg{margin-left:auto;display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.seg button{font-size:11.5px;padding:3px 9px;border-radius:6px;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:550;box-shadow:var(--sh-1)}
/* 面板标题右侧的控制组：处理开关与时间窗各成一组，整组靠右并允许换行 */
.ctrls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrls .seg{margin-left:0}

.costgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:720px){.costgrid{grid-template-columns:repeat(4,1fr)}}
.costgrid .item{min-width:0}
.costgrid .item .k{font-size:11.5px;color:var(--muted)}
.costgrid .item .v{font-size:15px;font-weight:600;margin-top:3px;font-variant-numeric:var(--tnum)}
.costgrid .item .v small{font-size:11.5px;font-weight:400;color:var(--muted);margin-left:3px}
.traffic{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.traffic .trow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:7px}
.traffic .trow .r{font-variant-numeric:var(--tnum);color:var(--muted)}
.bar.big{height:6px;border-radius:3px}

.chartbox{margin:0 -4px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:10.5px;fill:var(--faint);font-variant-numeric:var(--tnum)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted)}
.chart-empty{height:120px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint)}

.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend .leg{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid transparent;border-radius:7px;transition:background .15s,border-color .15s,color .15s}
.legend .leg:hover{background:var(--panel-2);border-color:var(--line)}
.legend .leg.on{background:var(--panel-2);border-color:var(--line);color:var(--fg)}
.legend .leg i{width:12px;height:2px;border-radius:1px;display:block;flex-shrink:0}
.tag{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 5px;white-space:nowrap}
/* 标识始终占位、只切可见性：表格是 table-layout:auto，一旦这个元素从无到有，
   名称列会变宽并把「当前/平均/最低/最高/丢包」五列一起挤窄，数字就跳位。
   用 display:none 不行——那等于没有占位，照样跳。 */
.tag.reserve{visibility:hidden}
.lat-note{margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.7}
.lat-note b{color:var(--muted);font-weight:550}

table.probes{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}
table.probes th{text-align:right;font-weight:500;color:var(--muted);padding:0 0 8px;font-size:11.5px;border-bottom:1px solid var(--line-2)}
table.probes th:first-child{text-align:left}
table.probes td{text-align:right;padding:8px 0;border-bottom:1px solid var(--line-2);font-variant-numeric:var(--tnum)}
table.probes td:first-child{text-align:left;font-variant-numeric:normal}
table.probes tr:last-child td{border-bottom:0}
table.probes tr[data-act]{cursor:pointer}
table.probes tr[data-act]:hover td{background:var(--panel-2)}
table.probes tr.on td{background:color-mix(in srgb,var(--c1) 8%,transparent)}
.pname{display:inline-flex;align-items:center;gap:7px}

.rc{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:820px){.rc{grid-template-columns:1fr 1fr}}
.rc h3{font-size:12px;font-weight:550;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rc h3 b{font-weight:600;color:var(--fg);font-variant-numeric:var(--tnum);font-size:13px}

.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px}
@media(min-width:640px){.info{grid-template-columns:repeat(3,1fr)}}
.info .item{min-width:0}
.info .item .k{font-size:11.5px;color:var(--muted)}
.info .item .v{font-size:13px;margin-top:3px;font-variant-numeric:var(--tnum);word-break:break-all}
</style>

    if (pingTry[n.id] && now - pingTry[n.id] < (pingWait[n.id] || PING_TTL)) return;

      // 从 6 秒起指数退避、最多退到常规周期——波线不必为一个失败的请求空等一整分钟。
      if (s && s.probes.length){

  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var yMin = o.yMin != null ? o.yMin : 0;
  var yMax = o.yMax != null ? o.yMax : niceTop(Math.max.apply(null, ys), o.base || 10);
  if (yMax <= yMin) yMax = yMin + 1;
  var sx = function(x){ return pl + (x1 === x0 ? iw/2 : (x-x0)/(x1-x0)*iw); };
  var sy = function(y){ return pt + (1-(y-yMin)/(yMax-yMin))*ih; };
  var yFmt = o.yFmt || function(v){ return String(Math.round(v)); };
  var xFmt = o.xFmt || clock;

  var out = ['<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img">'];
  // 网格与 y 轴
  for (var g = 0; g <= 4; g++){
    var v = yMin + (yMax-yMin)*g/4, y = sy(v);
    out.push('<line class="' + (g === 0 ? "base" : "grid") + '" x1="' + pl + '" y1="' + y.toFixed(1) +
      '" x2="' + (w-pr) + '" y2="' + y.toFixed(1) + '"/>');
    out.push('<text class="lbl" x="' + (pl-8) + '" y="' + (y+3.5).toFixed(1) + '" text-anchor="end">' + esc(yFmt(v)) + '</text>');
  }
  // x 轴
  timeTicks(x0, x1, 6).forEach(function(t){
    if (t < x0 || t > x1) return;
    out.push('<text class="lbl" x="' + sx(t).toFixed(1) + '" y="' + (h-8) + '" text-anchor="middle">' + esc(xFmt(t)) + '</text>');
  });
  // 折线。超时的点直接跳过，但**线不断开**——留断口会让整条走势被切成碎片，
  // 而丢包信息本来就由下表与卡片上的丢包率承载，不必再让曲线去表达。
  series.forEach(function(s){
    var color = s.color || "var(--c1)";
    var d = "", first = null, last = null;
    s.points.forEach(function(p){
      if (!num(p.y)) return;
      var X = sx(p.x), Y = sy(p.y);
      if (first === null) first = X;
      last = X;
      d += (d ? "L" : "M") + X.toFixed(1) + " " + Y.toFixed(1) + " ";
    });
    if (!d) return;
    if (s.fill){
      var base = sy(yMin).toFixed(1);
      out.push('<path d="' + d + 'L' + last.toFixed(1) + ' ' + base + 'L' + first.toFixed(1) + ' ' + base +
        ' Z" fill="' + color + '" fill-opacity=".14" stroke="none"/>');
    }
    out.push('<path d="' + d.trim() + '" fill="none" stroke="' + color +
      '" stroke-width="' + (s.width || 1.6) + '" stroke-linejoin="round" stroke-linecap="round"/>');
  });
  out.push('</svg>');
  return out.join("");
}
/**
 * 迷你曲线。lo/hi 给定时用调用方给的纵轴范围，否则按自身数据归一化。
 * 三网并排时**必须**传同一组 lo/hi：各自归一化会把 37 ms 和 110 ms 画成一模一样
 * 的形状，而并排展示的全部意义就是看出哪一路更差。
 */
function spark(points, lo, hi){
  var vals = points.map(function(p){ return p.y; }).filter(num);
  if (vals.length < 2) return "";
  var mn = num(lo) ? lo : Math.min.apply(null, vals);
  var mx = num(hi) ? hi : Math.max.apply(null, vals);
  var rng = (mx - mn) || 1, n = points.length;
  var w = 96, h = 20;
  var sx = function(i){ return n === 1 ? 0 : i/(n-1)*w; };
  var sy = function(v){ return h-1.5 - (v-mn)/rng*(h-3); };
  var d = smoothPath(points.map(function(p, i){ return num(p.y) ? [sx(i), sy(p.y)] : null; }));
  if (!d) return "";
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><path d="' + d +
    '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
/**
 * 把点列连成平滑曲线：Catmull-Rom 转三次贝塞尔。曲线**穿过每个采样点**，
 * 只在拐角处抹圆——不像滑动平均那样把尖峰压平，数据的形状仍然忠实。
 * 传 null 表示断开（超时），断点两侧各自平滑，不跨断口连线。
 */
function smoothPath(pts){
  var out = [], seg = [];
  var tension = 6;   // 6 = 标准 Catmull-Rom；调大更接近折线，调小更圆
  function flush(){
    if (seg.length === 1){
      out.push("M" + seg[0][0].toFixed(1) + " " + seg[0][1].toFixed(1));
    } else if (seg.length >= 2){
      out.push("M" + seg[0][0].toFixed(1) + " " + seg[0][1].toFixed(1));
      for (var i = 0; i < seg.length - 1; i++){
        var p0 = seg[i-1] || seg[i], p1 = seg[i], p2 = seg[i+1], p3 = seg[i+2] || p2;
        var c1x = p1[0] + (p2[0]-p0[0])/tension, c1y = p1[1] + (p2[1]-p0[1])/tension;
        var c2x = p2[0] - (p3[0]-p1[0])/tension, c2y = p2[1] - (p3[1]-p1[1])/tension;
        out.push("C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) +
          " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1));
      }
    }
    seg = [];
  }
  pts.forEach(function(p){ if (p) seg.push(p); else flush(); });
  flush();
  return out.join("");
}

/* ---------------- 通用片段 ---------------- */
/** 状态文案。卡片徽标与地图弹窗共用，避免两处各写一份而说法不一致。 */
function statusLabel(n){
  var st = nodeState(n);
  if (st === "online") return "在线" + (uptimeShort(n.metrics.uptime) ? " " + uptimeShort(n.metrics.uptime) : "");
  if (st === "pending") return "已连接 · 待上报";
  var down = num(n.last_seen) && n.last_seen > 0 ? Date.now()/1000 - n.last_seen : 0;
  var known = (num(n.cpu_cores) && n.cpu_cores > 0) || (num(n.mem_total) && n.mem_total > 0);
  return known ? ("离线" + (down >= 60 ? " " + uptimeShort(down) : "")) : "未接入";
}
/** 卡片与弹窗共用的副标题行：系统 · 虚拟化 · 架构 */
function subLine(n){
  var s = n.os ? osName(n.os) : "等待首次上报";
  if (n.virt && n.virt !== "none") s += " · " + n.virt;
  if (n.arch) s += " · " + n.arch;
  return s;
}
function statusChip(n){
  var st = nodeState(n);
  return '<span class="chip' + (st === "online" ? " live" : st === "pending" ? " warn" : "") + '">' +
    '<span class="dot' + (st === "online" ? " pulse" : st === "pending" ? " pending" : " off") + '"></span>' +
    esc(statusLabel(n)) + '</span>';
}
function countryChip(n){
  if (!n.country) return "";
  var f = flagOf(n.country);
  return '<span class="chip" title="' + esc(String(n.country).toUpperCase()) + '">' +
    (f ? '<i class="fg">' + f + '</i>' : '') + esc(countryName(n.country)) + '</span>';
}
/**
 * 到期提示。这是最容易因为被忽略而真的出事的一条信息，所以一律做成带底色的胶囊，
 * 只用颜色区分紧急程度。阈值放到 30 天：只标 7 天的话，半个月后到期在列表里几乎看不见。
 */
function expiryHTML(d, long){
  if (d === null) return "";
  var lv = d < 0 ? "bad" : d <= 7 ? "warn" : d <= 30 ? "soon" : "calm";
  var text = d < 0 ? "已过期 " + (-d) + " 天"
    : d <= 7 ? "仅剩 " + d + " 天"
    : d + " 天后" + (long ? "到期" : "");
  return '<span class="exp pill ' + lv + '">' + text + '</span>';
}
function expiryText(n){
  var d = daysUntil(n.expires_at);
  if (d === null) return '<span class="exp pill calm" title="永不到期">' + FOREVER + '</span>';
  return expiryHTML(d, true);
}
function expirySmall(n){ return expiryHTML(daysUntil(n.expires_at), false); }
/** 卡片上的占用条：标签、数值、细条各占一行，三列并排也放得下。
 *  `fill` 是该条在正常水位下的颜色（超过 75% / 90% 仍会转成告警色）。 */
function meter(label, pct, foot, fill){
  var p = pct == null ? null : clamp(pct, 0, 100);
  var tone = p == null ? "flat" : p >= 90 ? "bad" : p >= 75 ? "warn" : "";
  return '<div class="meter"' + (fill ? ' style="--fill:' + fill + '"' : '') + '>' +
    '<div class="ml">' + esc(label) + '</div>' +
    '<div class="mv">' + esc(foot) + '</div>' +
    '<div class="bar"><i class="' + tone + '" style="width:' + (p == null ? 0 : p).toFixed(1) + '%"></i></div></div>';
}
/**
 * 延迟检测块：一路探测一行，三网就有三行。
 * 卡片上最多列 CARD_PROBES 路，多出来的在详情页看——列表要的是「通不通、多快」，
 * 不是完整的多路曲线。
 *
 * 行区高度固定为 CARD_PROBES 行（见 CSS 的 .latrows）：数据还没到时不会塌下去，
 * 到了之后也不会有一次高度跳动。加载中铺等高的骨架行，终态（离线/未接入/无探测）
 * 把提示放进行区里垂直居中。
 */
var CARD_PROBES = 3;
function latencyBlock(n){
  var head = '<div class="lathead"><span>延迟检测</span><span class="hint">近 1 小时</span></div>';
  var solo = function(text){
    return '<div class="latbox">' + head + '<div class="latrows">' +
      '<div class="latrow solo"><span class="pn">' + esc(text) + '</span><span class="sp"></span>' +
      '<span class="pv faint">—</span></div></div></div>';
  };
  // 骨架与真实行同构等高，占满整个行区：数据到达时高度零变化
  var skeleton = function(){
    var out = "";
    for (var i = 0; i < CARD_PROBES; i++){
      out += '<div class="latrow sk"><span class="pn"><i class="pd"></i></span>' +
        '<span class="sp"><i class="skbar"></i></span>' +
        '<span class="pv"><span class="ms"></span><i class="loss"></i></span></div>';
    }
    return '<div class="latbox">' + head + '<div class="latrows">' + out + '</div></div>';
  };
  if (!n.online) return solo(n.metrics == null && !(num(n.cpu_cores) && n.cpu_cores > 0) ? "未接入" : "离线");
  if (n.metrics == null) return solo("等待上报");
  var d = state.ping[n.id];
  if (!d) return skeleton();
  if (!d.probes.length) return solo("无探测");
  var shown = d.probes.slice(0, CARD_PROBES);
  // 三路共用一个纵轴范围，曲线的高低才可比。
  var lo = Infinity, hi = -Infinity;
  shown.forEach(function(p){ p.points.forEach(function(pt){
    if (!num(pt.y)) return;
    if (pt.y < lo) lo = pt.y;
    if (pt.y > hi) hi = pt.y;
  }); });
  var shared = isFinite(lo) && isFinite(hi) && hi > lo;
  var rows = shown.map(function(p, i){
    var color = probeColor(i);
    var ms = p.last == null
      ? '<span class="ms faint">超时</span>'
      : '<span class="ms">' + Math.round(p.last) + '<i class="u"> ms</i></span>';
    // 丢包率一律显示，0% 也占位，时延那一列才能上下对齐。
    var loss = '<i class="loss' + (p.loss > 0 ? " hit" : "") + '">' +
      (p.loss < 1 ? (p.loss > 0 ? "&lt;1" : "0") : Math.round(p.loss)) + '%</i>';
    return '<div class="latrow">' +
      '<span class="pn"><i class="pd" style="background:' + color + '"></i><span class="txt">' + esc(p.name) + '</span></span>' +
      '<span class="sp" style="color:' + color + '">' + (shared ? spark(p.points, lo, hi) : spark(p.points)) + '</span>' +
      '<span class="pv">' + ms + loss + '</span></div>';
  }).join("");
  var more = d.probes.length > CARD_PROBES
    ? '<div class="latmore">另有 ' + (d.probes.length - CARD_PROBES) + ' 路探测，见详情页</div>' : "";
  return '<div class="latbox">' + head + '<div class="latrows">' + rows + '</div>' + more + '</div>';
}

/* ---------------- 列表页 ---------------- */
/* 按币种分组折算月均支出。hub 只给每个节点自己的币种，没有汇率，
   把 USD 和 CNY 直接相加会得到一个不存在的数，所以分币种并列显示。 */
function costTotals(nodes){
  var by = {}, order = [];
  nodes.forEach(function(n){
    var c = monthlyCost(n);
    if (c == null) return;
    var k = n.currency || "CNY";
    if (by[k] == null){ by[k] = 0; order.push(k); }
    by[k] += c;
  });
  return order.map(function(k){ return money(by[k], k); });
}
/** 汇总磁贴。只返回磁贴本身，外层容器由调用方给（便于局部刷新，不牵动地图）。 */
function tilesHTML(nodes){
  var total = nodes.length;
  var online = nodes.filter(function(n){ return n.online; }).length;
  var monthRx = 0, monthTx = 0;
  nodes.forEach(function(n){
    monthRx += num(n.month_rx) ? n.month_rx : 0;
    monthTx += num(n.month_tx) ? n.month_tx : 0;
  });
  var totals = costTotals(nodes);
  var lat = [];
  nodes.forEach(function(n){
    var d = state.ping[n.id];
    if (n.online && d && d.probes[0] && d.probes[0].avg != null) lat.push(d.probes[0].avg);
  });
  var latTxt = lat.length ? Math.round(lat.reduce(function(a,b){ return a+b; },0)/lat.length) + " ms" : "—";
  var onlinePct = total ? Math.round(online/total*100) : 0;
  return '' +
    '<div class="tile t-online"><div class="k"><span class="dot' + (online ? " pulse" : " off") + '"></span>在线节点</div>' +
      '<div class="v tnum">' + online + '<small>/ ' + total + '</small></div>' +
      '<div class="s">' + (total - online) + ' 个离线 · 可用率 ' + onlinePct + '%</div></div>' +
    '<div class="tile t-lat"><div class="k">平均延迟</div><div class="v tnum">' + esc(latTxt) + '</div>' +
      '<div class="s">近 1 小时，各路探测平均</div></div>' +
    '<div class="tile t-flow"><div class="k">本月流量</div><div class="v tnum">' + bytes(monthRx + monthTx) + '</div>' +
      '<div class="s">↓ ' + bytes(monthRx) + ' · ↑ ' + bytes(monthTx) + '</div></div>' +
    '<div class="tile t-cost"><div class="k">月支出</div><div class="v tnum">' +
      (totals.length ? esc(totals[0]) : "—") + '</div>' +
      '<div class="s">' + (totals.length > 1 ? esc(totals.slice(1).join(" + ")) + " · 其他币种" : "按计费周期折算合计") + '</div></div>';
}
function nodeCard(n){
  var m = n.metrics, st = nodeState(n);
  var deployed = (num(n.cpu_cores) && n.cpu_cores > 0) || (num(n.mem_total) && n.mem_total > 0);
  var used = monthUsage(n);
  var hasLimit = num(n.traffic_limit) && n.traffic_limit > 0;
  var trafficPct = hasLimit ? percent(used, n.traffic_limit) : null;
  var trafficTone = trafficPct == null ? "" : trafficPct >= 90 ? "bad" : trafficPct >= 75 ? "warn" : "";
  var trafficText = hasLimit ? pair(used, n.traffic_limit) + " · " + trafficPct.toFixed(1) + "%"
    : bytes(used) + " / " + FOREVER;
  var mc = monthlyCost(n);
  // 没填价格的机器按「免费」呈现。有价格时才需要带计费周期，
  // 否则会渲染成「— ¥0.00」这种读不通的组合。
  var costHTML;
  if (mc != null) costHTML = esc(cycleLabel(n.billing_cycle)) + ' <b>' + esc(money(mc, n.currency)) + '/月</b>';
  else if (num(n.price) && n.price > 0) costHTML = esc(cycleLabel(n.billing_cycle)) + ' <b>' + esc(money(n.price, n.currency)) + '</b>';
  else costHTML = '<b class="free">免费</b>';

  var sub = subLine(n);

  var body;
  if (!deployed){
    // 两种「没有指标」要分开说：连上了但还没上报，和从来没接入过。
    body = '<p class="muted" style="margin-top:12px;font-size:12.5px;line-height:1.6">' +
      (st === "pending" ? "已连接，正在等待第一次上报。" : "还没有接入。在后台生成安装命令并执行一次。") + '</p>';
  } else {
    body =
      latencyBlock(n) +
      '<div class="meters">' +
        meter("CPU " + (num(n.cpu_cores) && n.cpu_cores > 0 ? n.cpu_cores : "?") + " 核", m ? m.cpu : null,
          m ? m.load.map(function(x){ return x.toFixed(2); }).join(" ") : "—", "var(--c1)") +
        meter("内存", m ? percent(m.mem_used, m.mem_total) : null,
          m ? pairShort(m.mem_used, m.mem_total) : bytes(n.mem_total), "var(--c5)") +
        meter("硬盘", m ? percent(m.disk_used, m.disk_total) : null,
          m ? pairShort(m.disk_used, m.disk_total) : bytes(n.disk_total), "var(--c3)") +
      '</div>' +
      '<div class="cfoot">' +
        '<div class="crow">' +
          '<span class="rates">' +
            '<span class="io"><span class="d">↓</span> <b>' + (m ? rate(m.net_rx) : "—") + '</b></span>' +
            '<span class="io"><span class="u">↑</span> <b>' + (m ? rate(m.net_tx) : "—") + '</b></span>' +
          '</span>' +
          '<span class="price">' + costHTML + '</span>' +
        '</div>' +
        (trafficPct != null
          ? '<div class="trafficbar"><i class="' + trafficTone + '" style="width:' + trafficPct.toFixed(1) + '%"></i></div>'
          : '') +
        '<div class="crow small">' +
          '<span>流量 <b>' + esc(trafficText) + '</b></span>' +
          '<span>累计 ↓' + bytes(n.total_rx) + ' ↑' + bytes(n.total_tx) + '</span>' +
        '</div>' +
      '</div>';
  }

  return '<article class="card' + (st === "online" ? "" : " off") + '" data-id="' + n.id + '" tabindex="0" role="button">' +
    '<div class="chead"><div class="l"><div class="nline"><h3 class="nname">' + esc(n.name) + '</h3>' + countryChip(n) + '</div>' +
    '<p class="sub">' + esc(sub) + '</p></div>' +
    '<div class="r">' + statusChip(n) + expiryText(n) + '</div></div>' + body + '</article>';
}
/* ==================== 世界地图 ==================== */
var MAP_LAND = null;          // 陆地点阵路径，只算一次
var MAP_CELL = 6;             // 每格 6 单位；点径由 CSS 的 stroke-width 决定
/**
 * 陆地点阵。每个点用「零长度线段 + 圆头线帽」画成圆点（`h.01` 配 stroke-linecap:round），
 * 比方块路径（`h4v4h-4z`）还短，而且圆点比方块明显更精致——方块在斜向海岸线上会露出锯齿。
 */
function mapLandPath(){
  if (MAP_LAND !== null) return MAP_LAND;
  var d = MAPDATA, out = [];
  for (var r = 0; r < d.rows; r++){
    var hex = d.land[r];
    for (var c = 0; c < d.cols; c++){
      var nib = parseInt(hex.charAt(c >> 2), 16);
      if ((nib >> (3 - (c % 4))) & 1){
        out.push("M" + ((c + 0.5) * MAP_CELL).toFixed(1) + " " + ((r + 0.5) * MAP_CELL).toFixed(1) + "h.01");
      }
    }
  }
  MAP_LAND = out.join("");
  return MAP_LAND;
}
var MAP_W = MAPDATA.cols * MAP_CELL;
var MAP_H = MAPDATA.rows * MAP_CELL;
function mapX(lon){ return (lon + 180) / 360 * MAP_W; }
function mapY(lat){ return (MAPDATA.latMax - lat) / (MAPDATA.latMax - MAPDATA.latMin) * MAP_H; }

/**
 * 按 country 把节点合并成地区。hub 只给国家码、不给经纬度，所以地图只能按国家定位。
 * 没有 country、或代码不在质心表里的节点进不了地图，单独计数后在页脚提示。
 */
function regionGroups(nodes){
  var by = {}, order = [], unmapped = 0;
  nodes.forEach(function(n){
    var cc = String(n.country || "").toUpperCase();
    var pt = cc && MAPDATA.cc[cc];
    if (!pt){ unmapped++; return; }
    if (!by[cc]){
      by[cc] = { cc: cc, label: countryName(cc), flag: flagOf(cc), lon: pt[0], lat: pt[1], total: 0, online: 0, nodes: [] };
      order.push(cc);
    }
    by[cc].total++;
    if (n.online) by[cc].online++;
    by[cc].nodes.push(n);
  });
  return { regions: order.map(function(k){ return by[k]; }), unmapped: unmapped };
}
/** 亮点颜色按在线率：全部在线绿、部分离线橙、全部离线红。 */
function regionTone(r){ return r.online === r.total ? "ok" : r.online === 0 ? "bad" : "warn"; }

function mapShellHTML(){
  return '<div class="mapbox" id="mapbox">' +
    '<div class="maphead"><span>节点分布</span></div>' +
    '<div class="mapwrap"><svg class="worldmap" viewBox="0 0 ' + MAP_W + ' ' + MAP_H + '" role="img" aria-label="节点分布世界地图">' +
      '<path class="land" d="' + mapLandPath() + '"/><g class="mdots"></g>' +
    '</svg></div>' +
    '<div class="mapfoot" id="mapfoot"></div>' +
    '<div class="mpop" id="mpop" hidden></div>' +
  '</div>';
}
/** 只更新亮点与页脚：陆地点阵有 1700 多个子路径，不能跟着每次筛选重建。 */
function renderMapDots(shown){

  // 地图重画后，原来打开的弹窗要重新定位
  if (popup.cc){
    var still = g.regions.some(function(r){ return r.cc === popup.cc; });
    if (still) openRegionPopup(popup.cc, true); else closePopup();
  }

/* ==================== 地区弹窗 ==================== */
var popup = { cc: null, sig: "" };
function closePopup(){
  popup.cc = null;
  popup.sig = "";
  var el = document.getElementById("mpop");
  if (el){ el.hidden = true; el.innerHTML = ""; }
}
/** 弹窗内容的指纹：地区、在线数、各节点的状态。用来判断有没有必要重建。 */
function popupSig(cc){
  var g = regionGroups(filterNodes(sortedNodes(), list.q));
  var r = null;
  g.regions.forEach(function(x){ if (x.cc === cc) r = x; });
  if (!r) return null;
  return r.cc + "|" + r.online + "|" + r.nodes.map(function(n){ return n.id + ":" + nodeState(n); }).join(",");
}
/** 把弹窗贴到亮点下方并夹在容器内。地图是等比缩放的 SVG，只能按屏幕坐标定位。 */
function placePopup(box, el, dot){
  var br = box.getBoundingClientRect(), dr = dot.getBoundingClientRect();
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = dr.left - br.left + dr.width / 2 - w / 2;
  el.style.left = Math.max(8, Math.min(left, br.width - w - 8)) + "px";
  var top = dr.bottom - br.top + 8;
  if (top + h > br.height - 6) top = Math.max(6, dr.top - br.top - h - 8);
  el.style.top = top + "px";
}
/**
 * 打开某地区的节点选择。
 * `keep` 表示这是地图重画后的续命调用：内容没变就只重新定位，**不重建 DOM**——
 * 每 2 秒一次的推送若把弹窗重建，用户正要点的那个按钮会被换掉，点击就落空了。
 */
function openRegionPopup(cc, keep){
  var box = document.getElementById("mapbox");
  var el = document.getElementById("mpop");
  var dot = box && box.querySelector('.mdot[data-cc="' + cc + '"]');
  if (!box || !el || !dot){ closePopup(); return; }
  var sig = popupSig(cc);
  if (sig === null){ closePopup(); return; }

  if (keep && popup.cc === cc && popup.sig === sig && !el.hidden){
    placePopup(box, el, dot);
    return;
  }
  var g = regionGroups(filterNodes(sortedNodes(), list.q));
  var r = null;
  g.regions.forEach(function(x){ if (x.cc === cc) r = x; });
  popup.cc = cc;
  popup.sig = sig;
  el.innerHTML = '<div class="ph"><b>' + (r.flag ? '<i class="fg">' + r.flag + '</i>' : '') + esc(r.label) +
    '</b><span>' + r.total + ' 个 · 在线 ' + r.online + '</span></div>' +
    r.nodes.map(function(n){
      var st = nodeState(n);
      return '<button class="pn" data-act="open-node" data-id="' + n.id + '">' +
        '<span class="r1"><span class="dot' + (st === "online" ? " pulse" : st === "pending" ? " pending" : " off") + '"></span>' +
        '<span class="nm">' + esc(n.name) + '</span></span>' +
        '<span class="r2">' + esc(statusLabel(n)) + ' · ' + esc(subLine(n)) + '</span></button>';
    }).join("");
  el.hidden = false;
  placePopup(box, el, dot);
}

/* ==================== 搜索与分组 ==================== */
var list = { q: "", group: "none" };
var GROUP_MODES = [
  { key: "none", label: "不分组" },
  { key: "region", label: "地区" },
  { key: "status", label: "在线状态" },
  { key: "cycle", label: "计费周期" }
];
/** 关键词匹配：节点名、地区名、国家码、系统、虚拟化。空格分词，全部命中才算匹配。 */
function matchNode(n, q){
  if (!q) return true;
  var hay = [n.name, countryName(n.country), n.country, osName(n.os), n.virt, n.arch, n.cpu_name]
    .filter(Boolean).join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(w){ return hay.indexOf(w) > -1; });
}
function filterNodes(nodes, q){ return q ? nodes.filter(function(n){ return matchNode(n, q); }) : nodes; }
/** 按模式分组，空组不出现。组间按数量降序，数量相同按名称。 */
function groupNodes(nodes, mode){
  if (mode === "none") return nodes.length ? [{ key: "", label: "", count: nodes.length, nodes: nodes }] : [];
  var by = {}, order = [];
  nodes.forEach(function(n){
    var k, label, flag;
    if (mode === "region"){
      k = String(n.country || "").toUpperCase() || "__none";
      label = k === "__none" ? "未标注地区" : countryName(k);
      flag = k === "__none" ? "" : flagOf(k);
    } else if (mode === "status"){
      k = nodeState(n);
      label = k === "online" ? "在线" : k === "pending" ? "已连接未上报" : "离线";
      flag = "";
    } else {
      k = n.billing_cycle || "__none";
      label = n.billing_cycle ? cycleLabel(n.billing_cycle) : "未设置计费周期";
      flag = "";
    }
    if (!by[k]){ by[k] = { key: k, label: label, flag: flag, count: 0, nodes: [] }; order.push(k); }
    by[k].count++;
    by[k].nodes.push(n);
  });
  return order.map(function(k){ return by[k]; }).sort(function(a, b){
    return b.count - a.count || String(a.label).localeCompare(String(b.label), "zh");
  });
}
function sortedNodes(){
  return (state.nodes || []).slice().sort(function(a, b){ return (a.sort||0)-(b.sort||0) || a.id - b.id; });
}
function toolsHTML(){

      '<input id="q" type="search" autocomplete="off" placeholder="搜索节点名、地区、系统…" value="' + esc(list.q) + '">' +
      // 清空按钮始终在 DOM 里，只切 hidden——重建工具栏会把输入框的焦点和光标吃掉
      '<button class="clr" data-act="clear-q" title="清空搜索"' + (list.q ? '' : ' hidden') + '>×</button>' +
    '</label>' +
    '<span class="seg" id="groupseg">' + GROUP_MODES.map(function(m){
      return '<button data-act="group" data-mode="' + m.key + '"' + (list.group === m.key ? ' class="on"' : '') + '>' + m.label + '</button>';
    }).join("") + '</span>' +

function renderList(){

/**
 * 只刷新会随数据/筛选变化的部分：网格、地图亮点、计数、汇总磁贴。
 * 工具栏不在这里重建——否则每 2 秒一次的推送会把搜索框的焦点和光标吃掉。
 */
function renderListBody(){
  if (route.kind !== "list") return;
  var sorted = sortedNodes();
  var shown = filterNodes(sorted, list.q);
  var groups = groupNodes(shown, list.group);

  var grid = document.getElementById("grid");
  if (grid){
    if (!sorted.length){
      grid.innerHTML = '<p class="empty">还没有节点</p>';
    } else if (!shown.length){
      grid.innerHTML = '<p class="empty">没有匹配「' + esc(list.q) + '」的节点。' +
        '<button data-act="clear-q" style="text-decoration:underline">清空搜索</button></p>';
    } else {
      grid.innerHTML = groups.map(function(g){
        return (g.label ? '<div class="ghead">' + (g.flag ? '<i class="fg">' + g.flag + '</i>' : '') +
          '<b>' + esc(g.label) + '</b><span class="n">' + g.count + '</span></div>' : '') +
          '<div class="grid">' + g.nodes.map(nodeCard).join("") + '</div>';
      }).join("");
    }
  }

  var sum = document.getElementById("summary");
  if (sum) sum.innerHTML = tilesHTML(sorted);
  renderMapDots(shown);
}

var PALETTE = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
/** 第 i 路探测的颜色。前几路是蓝 / 橙 / 紫，深浅两种主题下都能一眼分开。 */
function probeColor(i){ return PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length]; }
/** 某一路在列表里的位置。隔离后仍按这个位置取色，颜色不会跳。 */
function probeIndex(probes, id){
  for (var i = 0; i < probes.length; i++) if (probes[i].id === id) return i;
  return 0;
}

/** 复制一路探测并替换其曲线点，其余字段（名称、丢包）原样保留。 */
function withPoints(p, points){
  var out = {};
  for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) out[k] = p[k];
  out.points = points;
  return out;
}
/**
 * 「仅看」标识。未选中时用 visibility 隐藏而不是不渲染——它必须始终占着位置，
 * 否则表格的名称列会在点击前后变宽，把右侧的数值列一起挤动。
 */
function tagHTML(on){
  return ' <span class="tag' + (on ? "" : " reserve") + '">仅看</span>';
}
function renderLatency(){
  var box = document.getElementById("lat-box");
  if (!box) return;
  var d = detail.data.latency;
  if (d === null){ box.innerHTML = '<div class="chart-empty">延迟数据不可用</div>'; return; }
  var s = pingSummary(d);
  if (!s || !s.probes.length){ box.innerHTML = '<div class="chart-empty">该窗口内没有探测记录</div>'; return; }

  // 换了时间窗之后，原先隔离的那一路可能已经不在数据里
  if (detail.latOnly != null && !s.probes.some(function(p){ return p.id === detail.latOnly; })) detail.latOnly = null;

  var hours = detail.range.latency;
  var filters = { smooth: detail.latSmooth, despike: detail.latDespike };
  var anyFilter = filters.smooth || filters.despike;

  var all = anyFilter
    ? s.probes.map(function(p){ return withPoints(p, applyFilters(p.points, filters)); })
    : s.probes;

  var only = detail.latOnly;
  var onlyName = "";
  if (only != null) all.forEach(function(p){ if (p.id === only) onlyName = p.name; });
  var shown = onlyProbe(all, only);

  // 色板已经足够区分，不再叠虚线。隔离时单曲线加粗，并在折线下填一层同色面积，
  // 断口按段分开填充（见 svgChart）。
  var isolated = shown.length === 1;
  var series = shown.map(function(p){
    var i = probeIndex(all, p.id);
    return { name: p.name, color: probeColor(i), points: p.points,
      fill: isolated, width: isolated ? 2 : 1.6 };
  });

  var chartOpts = { series: series, h: 200, padL: 50, xFmt: clockFor(hours),
    yFmt: function(v){ return tickNum(v) + " ms"; } };

  var html = '<div class="chartbox">' + svgChart(chartOpts) + '</div>';

  // 图例始终列全：它同时是选择器，隔离之后还得靠它切回来
  if (all.length > 1){
    html += '<div class="legend">' + all.map(function(p, i){
      var on = p.id === only;
      return '<button class="leg' + (on ? " on" : "") + '" data-act="lat-only" data-id="' + p.id + '"' +
        ' title="' + (on ? "再点一次显示全部" : "只看这一路") + '">' +
        '<i style="background:' + probeColor(i) + '"></i>' + esc(p.name) + tagHTML(on) + '</button>';
    }).join("") + '</div>';
  }

  var notes = [];
  if (filters.despike) notes.push("<b>已削峰</b>");
  if (filters.smooth) notes.push("<b>已平滑</b>");
  if (only != null) notes.push("图中仅显示 <b>" + esc(onlyName) + "</b>，纵轴已按这一路重新缩放");
  if (notes.length){
    html += '<p class="lat-note">' + notes.join(" · ") +
      (anyFilter ? '　曲线为处理后的结果，下表统计仍基于原始样本' : '') +
      (only != null ? '　再点一次图例或下表可显示全部' : '') + '</p>';
  } else if (all.length > 1) {
    html += '<p class="lat-note">点图例或下表任意一路，图中只显示这一路</p>';
  }

  // 下表始终列全：它是读数的地方，不该跟着图一起被筛掉；被隔离的那行高亮。
  var selectable = all.length > 1;
  html += '<table class="probes"><thead><tr><th>探测</th><th>当前</th><th>平均</th><th>最低</th><th>最高</th><th>丢包</th></tr></thead><tbody>' +
    all.map(function(p){
      var i = probeIndex(all, p.id);
      var on = p.id === only;
      return '<tr class="' + (on ? "on" : "") + '"' +
        (selectable ? ' data-act="lat-only" data-id="' + p.id + '"' : '') + '>' +
        '<td><span class="pname"><i style="width:10px;height:2px;border-radius:1px;background:' + probeColor(i) + '"></i>' +
        esc(p.name) + tagHTML(on) + '</span></td>' +
        '<td>' + (p.last == null ? '<span class="faint">超时</span>' : Math.round(p.last) + ' ms') + '</td>' +
        '<td>' + (p.avg == null ? "—" : Math.round(p.avg) + ' ms') + '</td>' +
        '<td>' + (p.min == null ? "—" : Math.round(p.min) + ' ms') + '</td>' +
        '<td>' + (p.max == null ? "—" : Math.round(p.max) + ' ms') + '</td>' +
        '<td class="' + (p.loss > 0 ? "bad" : "") + '">' + (p.loss > 0 ? (p.loss < 1 ? "&lt;1" : Math.round(p.loss)) + "%" : "0%") + '</td></tr>';
    }).join("") + '</tbody></table>';

  var maxLoss = all.reduce(function(a, p){ return Math.max(a, p.loss); }, 0);
  if (maxLoss > 0) html += '<p class="lat-note">窗口内丢包率按探测统计，来自响应中的 loss 字段。</p>';
  box.innerHTML = html;
}
function renderResources(){
  var box = document.getElementById("res-box");
  if (!box) return;
  var d = detail.data.resources;
  var node = currentNode();
  if (d === null || !node){ box.innerHTML = '<div class="chart-empty">资源数据不可用</div>'; return; }
  var pts = Array.isArray(d.metrics) ? d.metrics : [];
  if (!pts.length){ box.innerHTML = '<div class="chart-empty">该窗口内没有历史指标</div>'; return; }
  var hours = detail.range.resources;
  var xFmt = clockFor(hours);
  var memTotal = num(node.mem_total) && node.mem_total > 0 ? node.mem_total : null;
  var diskTotal = num(node.disk_total) && node.disk_total > 0 ? node.disk_total : null;
  var last = pts[pts.length - 1];

  function pctSeries(key, total, color, fill){
    return { color: color, fill: fill, points: pts.map(function(p){
      var t = total || (p[key + "_total"] || 0);
      return { x: p.ts * 1000, y: t > 0 ? clamp(p[key] / t * 100, 0, 100) : 0 };
    }) };
  }
  var pctFmt = function(v){ return Math.round(v) + "%"; };
  var cpu = '<h3>CPU 使用率<b>' + (num(last.cpu) ? last.cpu.toFixed(1) + "%" : "—") + '</b></h3>' +
    svgChart({ series: [{ color:"var(--c1)", fill:true, points: pts.map(function(p){ return { x:p.ts*1000, y:p.cpu }; }) }],
      h: 132, yMax: 100, yFmt: pctFmt, xFmt: xFmt });
  var mem = '<h3>内存使用率<b>' + (memTotal ? (last.mem_used/memTotal*100).toFixed(1) + "%" : "—") + '</b></h3>' +
    svgChart({ series: [pctSeries("mem_used", memTotal, "var(--c5)", true)], h: 132, yMax: 100, yFmt: pctFmt, xFmt: xFmt });
  var disk = '<h3>磁盘使用率<b>' + (diskTotal ? (last.disk_used/diskTotal*100).toFixed(1) + "%" : "—") + '</b></h3>' +
    svgChart({ series: [pctSeries("disk_used", diskTotal, "var(--c3)", true)], h: 132, yMax: 100, yFmt: pctFmt, xFmt: xFmt });
  var net = '<h3>网络速率<b>' + rate(last.net_rx) + ' ↓</b></h3>' +
    svgChart({ series: [
        { color:"var(--c1)", fill:true, points: pts.map(function(p){ return { x:p.ts*1000, y:p.net_rx }; }) },
        { color:"var(--c2)", points: pts.map(function(p){ return { x:p.ts*1000, y:p.net_tx }; }) }
      ], h: 132, base: 1024, yFmt: function(v){ return v === 0 ? "0" : bytes(v, 0); }, xFmt: xFmt });
  box.innerHTML = '<div class="rc">' +
    '<div>' + cpu + '</div><div>' + mem + '</div><div>' + disk + '</div>' +
    '<div>' + net + '<div class="legend"><span><i style="background:var(--c1)"></i>下行</span>' +
      '<span><i style="background:var(--c2)"></i>上行</span></div></div></div>';
}
function currentNode(){
  if (!state.nodes) return null;
  for (var i = 0; i < state.nodes.length; i++) if (state.nodes[i].id === detail.id) return state.nodes[i];
  return null;
}
function loadDetailCharts(){
  var id = detail.id;
  var lh = detail.range.latency, rh = detail.range.resources;
  detail.loading.latency = true; detail.loading.resources = true;
  loadSeries(id, "ping", lh).then(function(d){
    if (detail.id !== id || detail.range.latency !== lh) return;
    detail.loading.latency = false; detail.data.latency = d; renderLatency();
  });
  loadSeries(id, "metrics", rh).then(function(d){
    if (detail.id !== id || detail.range.resources !== rh) return;
    detail.loading.resources = false; detail.data.resources = d; renderResources();
  });
}
function renderDetail(){
  var n = currentNode();
  if (!state.nodes){
    app.innerHTML = '<div class="wrap"><div class="skel" style="height:420px;margin-top:20px"></div></div>';
    return;
  }
  if (!n){
    app.innerHTML = '<div class="wrap"><p class="empty">节点不存在或未公开。' +
      '<button data-act="back" style="text-decoration:underline">返回列表</button></p></div>';
    return;
  }
  app.innerHTML = detailHTML(n);
  renderLatency(); renderResources();
  loadDetailCharts();
}

/* ---------------- 路由 ---------------- */
var route = { kind: "list", id: null };
function readRoute(){
  var m = location.pathname.match(/^\/node\/(\d+)/);
  return m ? { kind: "detail", id: Number(m[1]) } : { kind: "list", id: null };
}
function go(id){
  history.pushState({}, "", id === null ? "/" : "/node/" + id);
  applyRoute();
  window.scrollTo(0, 0);
}
function applyRoute(){
  var next = readRoute();
  if (next.kind === "detail" && (route.kind !== "detail" || route.id !== next.id)){
    detail.id = next.id;
    detail.range = { latency: 1, resources: 1 };
    detail.data = { latency: null, resources: null };
    resetLatView();
  }
  route = next;
  if (route.kind === "detail"){ renderDetail(); }
  else { renderList(); }
  document.title = [route.kind === "detail" && currentNode() ? currentNode().name : null,
    state.me && state.me.site_name ? state.me.site_name : "探针"].filter(Boolean).join(" · ");
}

/* ---------------- 事件 ---------------- */
document.addEventListener("click", function(e){
  // 点在任何地方都先收弹窗，除非点的是弹窗自身或另一个亮点
  if (popup.cc && e.target.closest && !e.target.closest("#mpop") && !e.target.closest('[data-act="dot"]')) closePopup();
  var act = e.target.closest ? e.target.closest("[data-act]") : null;
  if (act){
    var a = act.getAttribute("data-act");
    if (a === "back"){ closePopup(); go(null); return; }
    if (a === "reload"){ location.reload(); return; }
    if (a === "toggle-theme"){ toggleTheme(); return; }
    if (a === "dot"){
      var dcc = act.getAttribute("data-cc");
      if (popup.cc === dcc) closePopup(); else openRegionPopup(dcc);
      return;
    }
    if (a === "open-node"){ closePopup(); go(Number(act.getAttribute("data-id"))); return; }
    if (a === "clear-q"){
      list.q = "";
      var qi = document.getElementById("q");
      if (qi){ qi.value = ""; qi.focus(); }
      var qc = document.querySelector('[data-act="clear-q"]');
      if (qc) qc.hidden = true;
      renderListBody();
      return;
    }
    if (a === "group"){
      list.group = act.getAttribute("data-mode");
      var gs = document.querySelectorAll('[data-act="group"]');
      for (var gi = 0; gi < gs.length; gi++) gs[gi].classList.toggle("on", gs[gi] === act);
      renderListBody();
      return;
    }
    if (a === "range"){
      var kind = act.getAttribute("data-kind"), h = Number(act.getAttribute("data-h"));
      detail.range[kind] = h;
      detail.data[kind] = null;
      var segs = app.querySelectorAll('[data-act="range"][data-kind="' + kind + '"]');
      for (var i = 0; i < segs.length; i++) segs[i].classList.toggle("on", Number(segs[i].getAttribute("data-h")) === h);
      if (kind === "latency"){ document.getElementById("lat-box").innerHTML = '<div class="chart-empty">加载中…</div>'; }
      else { document.getElementById("res-box").innerHTML = '<div class="chart-empty">加载中…</div>'; }
      loadDetailCharts();
      return;
    }
    if (a === "lat-toggle"){
      var mode = act.getAttribute("data-mode");
      if (mode === "smooth") detail.latSmooth = !detail.latSmooth;
      else if (mode === "despike") detail.latDespike = !detail.latDespike;
      act.classList.toggle("on", mode === "smooth" ? detail.latSmooth : detail.latDespike);
      renderLatency();
      return;
    }
    if (a === "lat-only"){
      var pid = Number(act.getAttribute("data-id"));
      // 再点一次同一路即取消隔离，回到全部
      detail.latOnly = (detail.latOnly === pid) ? null : pid;
      renderLatency();
      return;
    }
  }
  var card = e.target.closest ? e.target.closest(".card") : null;
  if (card){ go(Number(card.getAttribute("data-id"))); return; }
  var brand = e.target.closest ? e.target.closest('[data-act="home"]') : null;
  if (brand){ go(null); }
});
document.addEventListener("input", function(e){
  if (!e.target || e.target.id !== "q") return;
  list.q = e.target.value;
  var clr = document.querySelector('[data-act="clear-q"]');
  if (clr) clr.hidden = !list.q;
  renderListBody();
});
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var card = e.target.closest ? e.target.closest(".card") : null;
  if (card){ e.preventDefault(); go(Number(card.getAttribute("data-id"))); return; }
  var dot = e.target.closest ? e.target.closest('[data-act="dot"]') : null;
  if (dot){
    e.preventDefault();
    var dcc = dot.getAttribute("data-cc");
    if (popup.cc === dcc) closePopup(); else openRegionPopup(dcc);
  }
});
window.addEventListener("popstate", function(){ applyRoute(); });

/* ---------------- 主题切换 ---------------- */
function applyTheme(dark){
  document.documentElement.classList.toggle("dark", dark);
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
}
function toggleTheme(){
  applyTheme(!document.documentElement.classList.contains("dark"));
}
(function initTheme(){
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  var dark = saved ? saved === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(!!dark);
})();

/* ---------------- 页头 ---------------- */
function headerHTML(){
  var me = state.me || {};
  return '<header class="top"><div class="wrap"><div class="top-in">' +
    // 站点名靠左、右侧按钮组靠右：用 margin-right:auto 顶开，比塞一个 spacer 元素更明确
    '<button class="brand" data-act="home"><span class="mark"></span>' + esc(me.site_name || "探针") + '</button>' +
    '<span class="hd-actions">' +
      '<a class="iconbtn" href="/admin/">' + esc(me.authed ? "进入后台" : "登录") + '</a>' +
      '<button class="iconbtn only" data-act="toggle-theme" title="切换深浅色">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
        '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' +
      '</button>' +
    '</span>' +
  '</div></div></header>';
}
function shell(){
  var existing = document.querySelector("header.top");
  if (existing) existing.outerHTML = headerHTML();
  else app.insertAdjacentHTML("beforebegin", headerHTML());
}

/* ---------------- 实时数据流 ---------------- */
var meReloaded = false;
function onNodes(list){
  state.nodes = safeNodes(list);
  state.error = ""; state.closed = false; meReloaded = false;
  if (!NODES_LOADED){ NODES_LOADED = true; startPing(); }
  if (route.kind === "detail"){
    // 直接打开 /node/{id} 时节点列表还没到，先渲染了骨架屏；这一份数据到达后
    // 才补上整页。之后的推送只更新页头，不重建图表。
    if (!app.querySelector(".dhead")) renderDetail();
    else renderDetailLive(currentNode());
  } else if (document.getElementById("grid")) {
    renderListBody();      // 只刷新网格/地图/计数，工具栏不动，搜索框焦点得以保留
  } else {
    renderList();
  }
}
/**
 * 公开页在标签页打开期间被关掉了。`me` 里存的是打开时的答案，所以重新问一次；
 * 已经关闭且没人登录就把访客送去后台，而不是留在一个不再更新的列表上。
 * 一次失联只问一次，避免轮询把 /me 打成心跳。
 */
function reloadMe(){
  api("/me").then(function(me){
    state.me = me;
    if (!me.public_page && !me.authed) location.href = "/admin/";
  }).catch(function(){ /* 网络仍不通，保留页面上的错误提示 */ });
}
function connect(){
  var proto = location.protocol === "https:" ? "wss" : "ws";
  var socket = null, poll = null, retry = null, stopped = false;
  function fail(msg, status){
    state.error = msg || "网络错误";
    if (status === 401){
      state.closed = true;
      if (!meReloaded){ meReloaded = true; reloadMe(); }
    }
    if (route.kind === "list") renderListBody();
  }
  function fetchOnce(){
    api("/nodes").then(function(d){ onNodes(d && d.nodes); })
      .catch(function(e){ fail(e.message, e.status); });
  }
  fetchOnce();
  function startPoll(){ if (!poll) poll = setInterval(fetchOnce, 5000); }
  function stopPoll(){ if (poll){ clearInterval(poll); poll = null; } }
  function open(){
    try { socket = new WebSocket(proto + "://" + location.host + "/api/ws"); }
    catch (e) { startPoll(); return; }
    socket.onmessage = function(ev){
      var d = null;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      onNodes(d && d.nodes);
      stopPoll();
    };
    socket.onerror = function(){ try { socket.close(); } catch (e) {} };
    socket.onclose = function(){
      if (stopped) return;
      startPoll();
      retry = setTimeout(open, 5000);
    };
  }
  open();
  return function(){ stopped = true; if (socket) try { socket.close(); } catch (e) {} stopPoll(); if (retry) clearTimeout(retry); };
}

/* ---------------- 启动 ---------------- */
function boot(){
  api("/me").then(function(me){
    state.me = me;
    if (!me.public_page && !me.authed){ location.href = "/admin/"; return; }
    shell();
    applyRoute();
    connect();
    // 详情页每 60 秒刷新一次图表，避免频繁重绘
    setInterval(function(){
      if (route.kind === "detail" && document.visibilityState === "visible") loadDetailCharts();
    }, 60000);
  }).catch(function(e){
    app.innerHTML = '<div class="wrap" style="padding-top:80px;text-align:center">' +
      '<p class="muted" style="margin-bottom:12px">加载失败：' + esc(e.message || "网络错误") + '</p>' +
      '<button class="iconbtn" data-act="reload" style="display:inline-flex">重试</button></div>';
  });
}
boot();
</script>
